<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset=".5" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#C147FF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square base, brand gradient -->
  <rect width="128" height="128" rx="28" fill="url(#g)"/>
  <!-- Stylized "yoink" claw / hook on a stack of cards -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Card stack (3 cards) -->
    <rect x="30" y="42" width="60" height="42" rx="6" fill="#fff" fill-opacity="0.18" stroke-opacity="0.65"/>
    <rect x="38" y="50" width="60" height="42" rx="6" fill="#fff" fill-opacity="0.30" stroke-opacity="0.85"/>
    <rect x="46" y="58" width="60" height="42" rx="6" fill="#fff" fill-opacity="0.95" stroke="#fff"/>
    <!-- Hook -->
    <path d="M64 22 L64 38" stroke-width="7"/>
    <path d="M52 22 L76 22" stroke-width="7"/>
  </g>
</svg>
